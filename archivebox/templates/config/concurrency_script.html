<style>
.config-concurrency { display: grid; gap: 10px; }
.config-concurrency input { box-sizing: border-box; min-width: 0; }
.config-concurrency-limit { display: flex; gap: 10px; align-items: center; }
.config-concurrency-limit input[type="range"] { min-width: 60px; width: 100%; accent-color: #007aff; }
.config-concurrency-limit input[type="number"] { width: 110px; flex: 0 0 110px; }
.config-concurrency-status { font-size: 11px; color: #6e7078; }
</style>
<script>
(() => {
    const initialize = () => document.querySelectorAll('.config-concurrency:not([data-ready])').forEach(widget => {
        widget.dataset.ready = 'true';
        const input = widget.querySelector('.plugin-config-input');
        const slider = widget.querySelector('[data-concurrency-slider]');
        const status = widget.querySelector('.config-concurrency-status');
        const amount = input.cloneNode(false);
        amount.removeAttribute('name'); amount.removeAttribute('data-config-key');
        amount.classList.remove('plugin-config-input'); amount.classList.add('config-concurrency-value');
        amount.placeholder = 'Automatic'; amount.required = false;
        input.id += '_canonical'; input.type = 'hidden'; input.after(amount);
        const update = () => {
            const automatic = Number(input.value) === 0;
            amount.value = automatic ? '' : input.value;
            slider.max = Math.max(10, Number(input.value) || 1);
            slider.value = Number(input.value) || 0;
            slider.setAttribute('aria-valuetext', automatic ? 'Automatic' : input.value);
            status.textContent = automatic ? 'Uses available resources' : input.value === '1' ? 'One snapshot at a time' : `Up to ${input.value} snapshots at once`;
        };
        const setValue = value => { input.value = value; input.dispatchEvent(new Event('input', {bubbles: true})); input.dispatchEvent(new Event('change', {bubbles: true})); };
        amount.addEventListener('input', () => { if (!amount.validity.badInput) setValue(amount.value || '0'); });
        slider.addEventListener('input', () => setValue(slider.value));
        input.addEventListener('input', update);
        input.addEventListener('change', update);
        update();
    });
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initialize, {once: true}); else initialize();
})();
</script>
